[project]
name = "ripple-backend"
version = "0.1.0"
description = "Ripple backend services: Claude-built behavioural twins synced through SpacetimeDB"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "pillow>=12.3.0",
    "playwright==1.63.0",
    "pydantic>=2.7",
    "requests>=2.32",
    "scweet>=5.8.1",
    "uagents>=0.26,<0.27",
    "uagents-core>=0.4.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
